<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bhopper</title>
    <style>
      :root {
        --red: #bd3039;
        --navy: #0c2340;
        --cream: #f5f2ea;
        --slate: #5c6470;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        background: var(--cream);
        color: var(--navy);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
      }
      main { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
      h1 { color: var(--red); font-size: 2rem; margin: 0 0 8px; }
      h2 { color: var(--navy); font-size: 1.25rem; margin: 32px 0 8px; }
      p { margin: 0 0 12px; }
      a { color: var(--red); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .meta { color: var(--slate); font-size: 0.9rem; }
      nav { margin-top: 24px; display: flex; gap: 16px; }
      nav a { padding: 8px 12px; background: white; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bhopper</h1>
      <p>Live cover and wait reports from people actually at Boston bars right now. Anonymous. No accounts.</p>
      <nav>
        <a href="/bhopper-site/privacy.html">Privacy</a>
        <a href="/bhopper-site/support.html">Support</a>
      </nav>
    </main>
  </body>
</html>
